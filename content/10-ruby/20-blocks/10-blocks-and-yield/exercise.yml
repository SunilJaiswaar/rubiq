id: ruby-blocks-retry
language: ruby
title: Build the retry wrapper
brief: >-
  Write `retry_up_to(times)`. It takes a block and calls it. If the block raises, it tries
  again, up to `times` attempts in total. If the last attempt still raises, let that error
  escape unchanged. On success, return whatever the block returned.


  This is the same inversion of responsibility as `File.open`: the caller supplies the work
  and your method owns the policy around it. The caller writes
  `retry_up_to(3) { charge_card! }` and never writes a loop.


  Two decisions to make deliberately rather than by accident. Which exceptions should you
  catch — and what should `times` of zero do?
starter: |
  def retry_up_to(times)
    # Your code here. The block is invoked with `yield`.
    #
    # Hints:
    #   - `begin ... rescue ... end` is an expression, and Ruby has a keyword
    #     specifically for "run that block again". Find it.
    #   - "up to `times` attempts in total" means times == 1 is a single try.
    #   - On the final failure the original error must escape, with its class
    #     and backtrace intact.
  end

  # A little harness so you can see it work. Click Run.
  attempts = 0
  result = retry_up_to(5) do
    attempts += 1
    raise "attempt #{attempts} failed" if attempts < 3
    "succeeded on attempt #{attempts}"
  end

  puts result
solution: |
  def retry_up_to(times)
    # Decide the degenerate case explicitly. Returning nil for `times <= 0`
    # would look like success and silently skip the work.
    raise ArgumentError, 'times must be at least 1' if times < 1

    attempt = 0
    begin
      attempt += 1
      yield
    rescue StandardError
      # `retry` re-runs the whole `begin` body — which is why the counter is
      # incremented inside it rather than outside.
      retry if attempt < times

      # A bare `raise` inside a rescue re-raises the *same* exception object,
      # preserving its class, message and backtrace. `raise $!` is equivalent
      # but noisier; `raise err.message` would throw away the class and the
      # backtrace, which is what the caller needs to diagnose the cause.
      raise
    end
  end
hints:
  - >-
    Start with the success path only: `begin; yield; end`. Then add the `rescue` and ask
    what you want to happen inside it.
  - >-
    Ruby has a keyword for exactly this, and it is not a loop. Inside a `rescue`, `retry`
    jumps back to the start of the `begin` body and runs it again.
  - >-
    Because `retry` re-runs the whole `begin` body, anything you put in there runs again
    too. Put the attempt counter inside the body and increment it before `yield`, then
    compare against `times` in the rescue.
  - >-
    "Up to `times` attempts in total" — so `retry_up_to(1) { ... }` calls the block exactly
    once and lets the first failure through. Check your condition against that case.
  - >-
    Rescue `StandardError`, not `Exception`. A bare `rescue` already means `StandardError`,
    which is what you want: retrying on `Interrupt` ignores the user's Ctrl-C, and retrying
    on `SystemStackError` or `NoMemoryError` runs the failing work again on a machine that
    has already run out of room.
  - >-
    For the final failure, use a bare `raise` with no arguments. Inside a rescue that
    re-raises the same exception object — class, message and backtrace intact. Building a
    new error throws away the cause the caller needs.
  - >-
    What should `retry_up_to(0) { ... }` do? Falling out of the method returns `nil`, which
    the caller cannot distinguish from a block that legitimately returned `nil` — so the
    work is skipped and nothing says so. Raising `ArgumentError` is the honest answer.
tests:
  - id: returns-value
    name: Returns the value when the block succeeds first time
    call: "retry_up_to(3) { 42 }"
    expect: 42
  - id: single-attempt
    name: times = 1 calls the block exactly once
    call: "n = 0; begin; retry_up_to(1) { n += 1; raise 'x' }; rescue StandardError; end; n"
    expect: 1
  - id: retries-until-success
    name: Retries until the block stops raising
    call: "n = 0; retry_up_to(5) { n += 1; raise 'x' if n < 3; n }"
    expect: 3
  - id: stops-at-limit
    name: Makes no more than `times` attempts
    call: "n = 0; begin; retry_up_to(4) { n += 1; raise 'x' }; rescue StandardError; end; n"
    expect: 4
  - id: rethrows-last-error
    name: Lets the final error escape, with its original message
    call: "begin; retry_up_to(2) { raise 'still broken' }; rescue StandardError => e; e.message; end"
    expect: still broken
  - id: preserves-error-class
    name: Re-raises the original exception class, not a generic one
    hidden: true
    call: "begin; retry_up_to(2) { raise KeyError, 'nope' }; rescue StandardError => e; e.class.name; end"
    expect: KeyError
  - id: no-swallow-on-zero
    name: Does not silently skip the work when given zero attempts
    hidden: true
    call: "begin; retry_up_to(0) { 1 }; rescue ArgumentError; 'ArgumentError'; end"
    expect: ArgumentError
  - id: does-not-retry-non-standard-errors
    name: Does not retry errors outside StandardError
    hidden: true
    call: "n = 0; begin; retry_up_to(3) { n += 1; raise SystemStackError, 'deep' }; rescue SystemStackError; end; n"
    expect: 1
