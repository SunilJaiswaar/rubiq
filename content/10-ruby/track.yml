title: Ruby
tagline: The language, understood rather than memorised.
category: Languages
icon: gem
accent: ruby
difficulty: beginner
order: 10
prerequisites: []
description: >-
  Ruby rewards people who understand why it is shaped the way it is. Almost every piece
  of Ruby syntax that looks strange at first — blocks, symbols, `yield`, modules, open
  classes — exists to solve a specific problem, and once you know the problem the syntax
  stops being arbitrary.


  This track teaches Ruby in that order: the problem first, then the feature. It does not
  assume you have written Ruby before. It does assume you would rather understand one
  thing properly than skim ten.


  It goes all the way: the object model and method lookup, blocks and Enumerable,
  equality and what it costs that most objects can be changed by whoever holds them,
  metaprogramming and the discoverability it trades away, and finally the runtime —
  where the memory goes, and why threads make I/O faster and computation no faster at
  all.
outcomes:
  - Read Ruby written by other people without guessing
  - Use blocks and `yield` deliberately, not by imitation
  - Explain the difference between a proc and a lambda, and why it exists
  - Choose between a module and a class for a given job
  - Find a bug in Ruby code by reasoning about the object model
  - Implement ==, eql? and hash correctly, and say why all three are needed
  - Freeze at boundaries, and know what dup, clone and freeze do not cover
  - Write attr_accessor yourself, and know when not to generate methods
  - Use method_missing with both hooks, or recognise why you should not use it
  - Diagnose a growing process as retention or fragmentation
  - Choose between threads, processes, fibers and Ractors for a given workload
