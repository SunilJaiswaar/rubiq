passScore: 0.7
questions:
  - id: lexical
    kind: choice
    concept: lexical-scoping
    prompt: |
      ```ruby
      message = 'defined here'
      show = -> { message }

      def elsewhere(callable)
        message = 'called here'
        callable.call
      end

      p elsewhere(show)
      ```
      What prints, and why?
    options:
      - text: '`"defined here"` — names resolve through the enclosing text, not the call stack'
        correct: true
        feedback: >-
          That is lexical scoping, and it is what makes a lambda readable without knowing
          who calls it.
      - text: '`"called here"` — the nearest value on the call stack wins'
        feedback: >-
          That would be *dynamic* scoping. Bash has it; almost no modern language does,
          precisely because it makes functions unreadable in isolation.
      - text: "`nil`"
        feedback: "`message` is found — just the one that textually encloses the lambda."
    explanation: >-
      Ruby resolves names lexically: outward through the scopes that enclose the place the
      code was *written*. `elsewhere`'s local `message` does not enclose the lambda, so it is
      never consulted — and in fact `def elsewhere` opens a scope that cannot see the outer
      `message` either, in both directions. The alternative, resolving through the call
      stack, means a method's behaviour depends on who called it, which is why it was
      abandoned. Ruby keeps two small pieces of dynamic scope — global variables and
      `Thread.current` — and both are discouraged for exactly this reason.

  - id: def-no-closure
    kind: choice
    concept: scope
    prompt: |
      ```ruby
      def outer
        secret = 'hidden'

        def inner
          secret
        end

        inner
      end

      outer
      ```
      What happens?
    options:
      - text: "`NameError` — `def` opens a fresh scope that cannot see the enclosing locals"
        correct: true
        feedback: >-
          Use a lambda or `define_method` when you need to close over something. This is the
          biggest scoping difference between Ruby and JavaScript or Python.
      - text: "It returns `\"hidden\"` — nested definitions close over their enclosing scope"
        feedback: >-
          That is what JavaScript and Python do. In Ruby only blocks, procs, lambdas and
          `define_method` close over; `def` does not.
      - text: "It returns `nil`, because `secret` is treated as an uninitialised local"
        feedback: >-
          Inside `inner` the name is not a known local at all, so Ruby treats it as a method
          call and raises `NameError`.
    explanation: >-
      `def` creates a scope with nothing inherited — no locals from around it, in either
      direction. Blocks, procs, lambdas and `define_method` all capture their surroundings.
      This is why `define_method` exists and is not merely a dynamic alternative to `def`: it
      is the only way to define a *method* that closes over a value, which is how most of the
      methods Rails generates capture their configuration. A nested `def` is also not scoped
      to the outer method the way it looks — it defines the method on the enclosing class, so
      calling `outer` twice redefines `inner` rather than creating two of them.

  - id: for-loop-binding
    kind: choice
    concept: closures
    prompt: "`fns = []; for i in [0, 1, 2]; fns << -> { i }; end` — why do all three lambdas return 2?"
    options:
      - text: "`for` does not create a scope, so there is one binding for `i`, and it holds 2 once the loop ends"
        correct: true
        feedback: >-
          `[0, 1, 2].each { |i| fns << -> { i } }` gives `[0, 1, 2]`, because a block
          parameter is a fresh binding per iteration.
      - text: Closures capture values at call time rather than definition time
        feedback: >-
          They capture the *binding*. With `each` the same code gives 0, 1, 2 — so capture
          timing is not the difference.
      - text: Lambdas cannot capture loop variables
        feedback: They capture fine; the question is how many bindings there were to capture.
    explanation: >-
      There is exactly one `i` for the whole `for` loop, so all three lambdas reference the
      same binding, and that binding holds 2 after the loop exits. It also leaks: `i` is
      still defined afterwards. Every block-based iterator — `each`, `map`, `times`,
      `each_with_index` — gives each iteration its own binding, so the bug cannot occur.
      This is identical to JavaScript's `var`-in-a-loop problem, which `let` was introduced
      to fix; in Ruby it belongs to `for` alone, and is the clearest single reason `for` has
      effectively vanished from Ruby code.

  - id: parse-time-locals
    kind: choice
    concept: scope
    prompt: |
      ```ruby
      def maybe(flag)
        if flag
          answer = 'yes'
        end
        answer
      end

      p maybe(false)
      ```
      What does this print?
    options:
      - text: "`nil` — the parser created the local when it saw the assignment, even though it never ran"
        correct: true
        feedback: >-
          Which is why `if`-assigned variables are a quiet source of `NoMethodError ... for
          nil` later on. Make the `if` an expression and assign its value instead.
      - text: "It raises `NameError`, because the assignment never executed"
        feedback: >-
          Ruby decides a name is a local at parse time, not run time. Referencing it
          *before* the assignment appears in the source would raise; after it, you get nil.
      - text: "`\"yes\"` — `if` creates a scope whose last value leaks out"
        feedback: "`if` does not create a scope, and the branch did not run."
    explanation: >-
      Ruby marks a name as a local variable when the *parser* sees an assignment to it, not
      when the assignment executes. So after that line appears in the source the name exists
      and defaults to `nil`, whether or not the branch ran; before it appears, the same
      reference raises `NameError`. That gives a useful diagnostic rule: a `NameError` for a
      local means you referenced it above its assignment or misspelled it, while a surprising
      `nil` means the assignment is below you and did not run. The idiomatic fix is to make
      the conditional an expression — `answer = if flag then 'yes' else 'no' end` — so every
      branch produces a value and a missing case is visible in the shape of the code.

  - id: block-self
    kind: choice
    concept: closures
    prompt: >-
      Inside an instance method, `[1, 2].each { @count += 1 }` updates the right object. Inside
      `other.instance_eval { @count += 1 }`, it updates `other`. Why?
    options:
      - text: A block inherits `self` from where it was written, and `instance_eval` deliberately re-points `self` at its receiver
        correct: true
        feedback: >-
          That re-pointing is the mechanism behind `routes.draw`, RSpec's `describe`, a
          Gemfile and every other Ruby DSL.
      - text: Blocks have no `self`, so it is always the top-level `main`
        feedback: >-
          A block does have `self` — the one from its defining context, which is why
          instance variables work inside blocks at all.
      - text: "`each` strips `self` and `instance_eval` restores it"
        feedback: >-
          `each` does nothing to `self`. Only `instance_eval`, `instance_exec` and
          `class_eval` change it.
    explanation: >-
      A closure captures `self` along with the local bindings, and it captures it lexically —
      so a block inside an instance method sees that instance, and instance variables behave
      as you would expect. There is no equivalent of JavaScript's regular-versus-arrow
      function split, where `this` depends on how the function is called; that whole bug class
      does not exist in Ruby. What does exist is the deliberate version: `instance_eval` and
      `instance_exec` run a block with `self` set to the receiver, which is how Ruby DSLs turn
      a block into a configuration language. The trade is real — inside such a block the
      caller's own methods may be unreachable, which is confusing to debug — so `yield obj` is
      the safer convention for an ordinary API and `instance_eval` is for when you are
      deliberately building a DSL.

  - id: closure-leak
    kind: choice
    concept: closures
    prompt: >-
      A method builds an 8 MB array, computes its `size`, and returns `-> { size }`. Why might
      the 8 MB stay in memory, and how would you prove it?
    options:
      - text: "The lambda captures the whole enclosing binding, so the array stays reachable — `lambda.binding.local_variables` lists it"
        correct: true
        feedback: >-
          Compute the value in a separate method so the large object is never a local in the
          capturing scope.
      - text: Arrays over a certain size are never garbage collected
        feedback: Size is irrelevant to collection — reachability is what matters.
      - text: Returning a lambda always leaks
        feedback: >-
          Only if the captured binding holds something large. A closure over a single Integer
          is cheap.
    explanation: >-
      A closure keeps its defining scope alive, not just the variables it visibly uses, and
      Ruby lets you see exactly what that is: `Proc#binding` returns the captured scope as an
      object, and `binding.local_variables` names everything it is holding. So the leak is
      provable rather than inferred, which is an advantage over the equivalent JavaScript
      situation where engines may or may not optimise away unused captures. The fix is
      structural — compute the value in another method, so the large object dies with that
      frame — and the risk is concentrated in closures that outlive a request: a memoised
      callback, an `around_action`, an `ActiveSupport::Notifications` subscriber, or anything
      registered at boot. A closure created and dropped per request cannot hold much for long.

  - id: explain-stale-closure
    kind: recall
    concept: closures
    prompt: >-
      A colleague registers a callback at boot that reads a setting, then changes the setting at
      runtime and finds the callback still uses the old value. Explain the cause in closure
      terms, and give two fixes.
    key_points:
      - The closure was created once and captured the binding as it was at that moment
      - A closure captures the binding, so a *reassignment* elsewhere is not visible to it
      - If it captured the object and the object were mutated, it WOULD see the change
      - So the distinction is reassignment versus mutation, exactly as in the values lesson
      - Fix by closing over something stable and reading through it at call time
      - Or re-register the callback when the setting changes
    model: >-
      The callback was built once, at boot, and captured the binding that existed then. The
      important distinction is between reassignment and mutation. If the setting was later
      replaced — a new object assigned to a different variable, or a fresh config object built
      — the closure cannot see it, because it holds the old binding and lookup is lexical. If
      instead the same object had been mutated in place, the closure would see the change,
      because it captured a reference to that object rather than a copy. That is the same
      reassignment-versus-mutation split as the names-and-values lesson, showing up a layer
      out. The fixes follow from the framing. Either close over something stable and read
      through it at call time — the config object itself, or a lambda that fetches the current
      value, so the indirection happens on each call rather than once at capture — or treat
      the callback as derived state and re-register it when the setting changes. The one thing
      not to do is capture the value and hope, because nothing will report it: the callback
      keeps working and keeps being wrong.
