passScore: 0.7
questions:
  - id: lexical
    kind: choice
    concept: lexical-scoping
    prompt: |
      ```javascript
      const name = "global";
      function whoAmI() { return name }
      function caller() { const name = "caller"; return whoAmI() }
      console.log(caller());
      ```
      What prints, and why?
    options:
      - text: '`"global"` — names resolve through the enclosing text, not the call stack'
        correct: true
        feedback: >-
          That is lexical scoping, and it is what makes a function readable without knowing
          its callers.
      - text: '`"caller"` — the nearest value on the call stack wins'
        feedback: >-
          That would be *dynamic* scoping. Bash has it; almost no modern language does,
          precisely because it makes functions unreadable in isolation.
      - text: "`undefined`"
        feedback: "`name` is found — just the one that textually encloses `whoAmI`."
    explanation: >-
      JavaScript resolves names lexically: outward through the blocks that enclose the code
      where the function was *written*. `caller`'s local `name` does not enclose `whoAmI`, so
      it is never consulted. The alternative — resolving through the call stack — means a
      function's behaviour depends on who called it, which is why it was abandoned.

  - id: var-loop
    kind: choice
    concept: closures
    prompt: "`for (var i = 0; i < 3; i++) fns.push(() => i)` — why do all three return 3?"
    options:
      - text: "`var` is function-scoped, so there is one binding; by the time the closures ran, it held 3"
        correct: true
        feedback: >-
          `let` creates a fresh binding per iteration, which is specified behaviour, not a
          side effect.
      - text: Closures capture values at call time rather than definition time
        feedback: >-
          They capture the *binding*. With `let` the same code gives 0, 1, 2 — so capture
          timing is not the difference.
      - text: Arrow functions cannot capture loop variables
        feedback: They capture fine; the question is how many bindings there were to capture.
    explanation: >-
      There is exactly one `i` for the whole function, so all three closures reference the
      same box — and that box holds 3 once the loop exits. `let` is block-scoped and the
      specification creates a new binding for each iteration, so each closure captures its
      own. Before `let`, developers created the per-iteration scope by hand with an IIFE —
      that is what all those wrapper functions in older code were doing.

  - id: tdz
    kind: choice
    concept: scope
    prompt: "What is the difference between `var` and `let` with respect to hoisting?"
    options:
      - text: Both are hoisted, but only `var` is initialised to `undefined` — reading a `let` before its declaration throws
        correct: true
        feedback: >-
          That gap is the temporal dead zone, and it turns a silent `undefined` into a loud
          error.
      - text: "`let` is not hoisted at all"
        feedback: >-
          It is hoisted — that is how the engine knows to throw rather than looking at an
          outer scope.
      - text: "`var` is not hoisted; `let` is"
        feedback: Backwards. `var` hoisting initialised to `undefined` is the older behaviour.
    explanation: >-
      Both declarations are hoisted to the top of their scope. `var` is initialised to
      `undefined`, so reading it early is legal and silently gives you `undefined`. `let` and
      `const` are left uninitialised, and reading one in that window throws a ReferenceError.
      That window is the temporal dead zone, and it exists to convert a silent wrong value
      into an immediate error.

  - id: arrow-this
    kind: choice
    concept: closures
    prompt: "Inside `obj.method()`, why does `arr.forEach(function() { this.count++ })` fail where `arr.forEach(() => { this.count++ })` works?"
    options:
      - text: An arrow closes over `this` lexically; a regular function receives `this` from its own call site
        correct: true
        feedback: >-
          `forEach` calls the regular callback with no receiver, so `this` is not `obj`. The
          arrow keeps the enclosing `this`.
      - text: Regular functions cannot access `this` at all
        feedback: They can — it just is not the object you expected.
      - text: "`forEach` deliberately strips `this`"
        feedback: >-
          It simply calls the function without a receiver; the behaviour follows from how
          regular functions bind `this`.
    explanation: >-
      `this` is the one thing in JavaScript that is *not* lexically scoped in a regular
      function — it is determined by how the function is called. `forEach` invokes the
      callback with no receiver, so `this` is `undefined` in strict mode. An arrow function
      has no `this` of its own and closes over the enclosing one, which is the main practical
      reason to prefer arrows for callbacks.

  - id: closure-leak
    kind: choice
    concept: closures
    prompt: >-
      A function builds an 8 MB array, computes its length, and returns `() => length`. Why
      might the 8 MB stay in memory?
    options:
      - text: The closure captures the whole enclosing scope, so the array remains reachable while the function does
        correct: true
        feedback: >-
          Compute in a narrower inner scope so the large value is never part of the captured
          environment.
      - text: Arrays over a certain size are never garbage collected
        feedback: Size is irrelevant to collection — reachability is what matters.
      - text: Returning a closure always leaks
        feedback: >-
          Only if the captured scope holds something large. A closure over a single number
          is cheap.
    explanation: >-
      A closure keeps its defining scope alive, not just the variables it visibly uses.
      Engines sometimes optimise away unused captures, but you cannot rely on it — `eval` or
      an attached debugger defeats the analysis. This is the most common JavaScript memory
      leak: a long-lived handler or cache entry whose closure retains a scope containing
      something big. The fix is structural: compute in an inner function so the large value
      dies with it.

  - id: explain-stale-closure
    kind: recall
    concept: closures
    prompt: >-
      A React colleague has a `setInterval` callback that keeps logging the initial value of
      a state variable, not the current one. Explain the cause in closure terms.
    key_points:
      - The effect ran once, so the callback closed over the binding from that render
      - Each render creates new bindings; the interval still holds the first render's
      - Closures capture bindings from where they were defined, not where they run
      - It is the same mechanism as the `var` loop — one captured binding, read later
      - Fix by adding the value to the dependency array so the effect re-subscribes
      - Or use a ref, which is a stable box whose current value can be read
    model: >-
      The interval callback was created during one particular render and closed over that
      render's bindings. Every render creates a fresh set, so the state variable the callback
      can see is permanently the one from the render in which the effect ran — it has no way
      to reach the newer binding, because lookup is lexical and resolved where the function
      was written. It is structurally the same bug as `var` in a loop: a closure holding one
      binding and being read long after the surrounding code moved on. The fixes follow from
      that framing. Either add the value to the dependency array so the effect tears down and
      re-subscribes with a callback closing over the new binding, or keep the value in a ref —
      a stable object whose `.current` can be read at call time, so there is one box rather
      than one per render.
