passScore: 0.7
questions:
  - id: shallow-protects
    kind: choice
    concept: shallow-copy
    prompt: "After `copy = original.dup`, which of `original`'s values are protected from changes made through `copy`?"
    options:
      - text: "Only the immediate values — reassigning `copy[:k]` is safe, but any nested Hash, Array or String is shared"
        correct: true
        feedback: >-
          `dup` builds a new Hash holding the same value references. Integers and Symbols
          are immutable so they cannot be changed anyway; everything else is one object
          with two paths to it.
      - text: All of them — that is what a copy means
        feedback: >-
          Only one level deep. `copy[:nested][:x] = 1` reaches the original's nested Hash.
      - text: None of them
        feedback: >-
          The top level genuinely is independent: `copy[:n] = 2` does not affect
          `original[:n]`.
    explanation: >-
      `dup` builds a new container and copies each value in. For an Integer or Symbol that
      is a real copy — and it does not matter, because those are immutable. For a Hash,
      Array or mutable String the value *is* a reference, so you get a second reference to
      the same object. Hence: reassignment at the top level is safe, mutation at any depth
      is not. `merge` has exactly the same property, which is more surprising because it
      reads like a functional operation.

  - id: json-lossy
    kind: multi
    concept: deep-copy
    prompt: "What does `JSON.parse(JSON.generate(obj))` get wrong as a deep-copy technique in Ruby?"
    options:
      - text: Turns every Symbol into a String — as a key and as a value
        correct: true
        feedback: >-
          `symbolize_names: true` fixes the keys only, so `status: :pending` still comes
          back as `"pending"` and your `case ... when :pending` stops matching.
      - text: Turns a Time into a String
        correct: true
        feedback: The nastiest one — it works until something calls `.strftime`.
      - text: Raises on a circular reference, and on NaN or Infinity
        correct: true
        feedback: Marshal handles cycles; NaN and Infinity raise rather than becoming null.
      - text: Serialises an unsupported object to its `inspect` string
        correct: true
        feedback: >-
          A Set becomes `"#<Set: {1, 2}>"` — data-shaped nonsense that survives the round
          trip and breaks much later.
      - text: Fails to copy nested objects
        feedback: >-
          It does copy them — deeply. Isolation is the one thing it gets right; fidelity is
          what it loses.
    explanation: >-
      The JSON round-trip achieves isolation and sacrifices fidelity. It is defined only for
      what JSON can express, so Symbols flatten to Strings, Time becomes a String, NaN and
      Infinity raise, and anything with no `to_json` quietly becomes its `to_s` — which is
      the worst case, because a Set arriving as `"#<Set: {1, 2}>"` looks like data and fails
      somewhere else entirely. `Marshal.load(Marshal.dump(obj))` keeps Ruby types and
      handles cycles, and in Rails `deep_dup` is nicer still. But never `Marshal.load`
      anything from outside your own process — it can instantiate arbitrary objects and is a
      remote code execution vector.

  - id: structured-clone-limits
    kind: choice
    concept: deep-copy
    prompt: "What does `Marshal.load(Marshal.dump(obj))` NOT do?"
    options:
      - text: Call `initialize` — it allocates and sets instance variables directly
        correct: true
        feedback: >-
          So any invariant, connection or registration your constructor performs is skipped,
          and the object arrives with its state but without that side effect.
      - text: Preserve the object's class
        feedback: >-
          It does — unlike JavaScript's `structuredClone`, which drops the prototype. The
          copy is a real instance with all its methods.
      - text: Handle circular references
        feedback: It handles cycles correctly, and preserves shared references too.
    explanation: >-
      Marshal records the class name and the instance variables, then rebuilds the object by
      allocating it and setting the variables — `initialize` never runs. For a plain data
      object that is exactly right and better than `structuredClone`, which loses the
      prototype and gives you a method-less plain object. For an object whose constructor
      establishes something — a validated invariant, an open connection, a registration in
      some global list — the copy comes back with the data and without the effect. Classes
      that care define `marshal_dump` and `marshal_load`. Marshal also refuses Procs, IO
      objects and anything with singleton methods, raising `TypeError` rather than guessing.

  - id: structural-sharing
    kind: choice
    concept: immutability
    prompt: >-
      In `nxt = state.merge(user: state[:user].merge(name: 'Bo'))`, what is true of
      `nxt[:posts]`?
    options:
      - text: "It is the same Array as `state[:posts]` — `nxt[:posts].equal?(state[:posts])` is true"
        correct: true
        feedback: >-
          Which is what makes "never mutate state" cheap, and what makes an `equal?` check a
          valid way to decide nothing in `posts` changed.
      - text: It is a deep copy of `state[:posts]`
        feedback: >-
          Nothing copied it. `merge` copies the value, and the value is a reference, so both
          Hashes point at one Array.
      - text: It is `nil`
        feedback: "`merge` carries every key across, overriding only the ones you supply."
    explanation: >-
      This is structural sharing: only the path to the change is rebuilt, and every untouched
      subtree is reused by reference. The cost is O(depth of the change) rather than O(size of
      the state), which is why immutable updates are practical at all. The flip side is the
      hazard from the rest of this lesson — that shared Array is shared, so mutating
      `nxt[:posts]` changes `state[:posts]` too. Structural sharing is only safe in a codebase
      that has committed to not mutating; `equal?` tells you about identity, never about
      whether someone is about to write through it.

  - id: explain-copy-depth
    kind: recall
    concept: shallow-copy
    prompt: >-
      A colleague fixes an aliasing bug by deep-cloning a large API response on every
      request. Reviews are getting slower. What would you say?
    key_points:
      - A deep copy is O(total size) and is being paid on every request
      - The right question is which nested values anything actually mutates
      - If nothing mutates them, a shallow copy — or no copy — is correct and free
      - If something does mutate them, fix the mutation rather than defending against it
      - "\"I do not know what mutates it\" means the data is shared too widely; narrow the access instead"
      - Immutability with structural sharing gets isolation without the copy cost
    model: >-
      Deep cloning a large response on every request is paying O(total size) to defend
      against a mutation that may not exist. I would ask which nested values are actually
      mutated. If none are, the clone is pure cost and a shallow copy — or no copy — is
      correct. If something does mutate them, the better fix is to stop it mutating shared
      data rather than to copy defensively around it, because the copy only hides the
      design problem and has to be repeated at every boundary. If the honest answer is "I
      do not know what mutates it", that is the real finding: the data is reachable from too
      many places, and narrowing that is cheaper and safer than cloning. Where genuine
      isolation is needed and the data is large, immutable updates with structural sharing
      give it at the cost of the changed path only.
