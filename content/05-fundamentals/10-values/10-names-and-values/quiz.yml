passScore: 0.7
questions:
  - id: aliasing
    kind: choice
    concept: assignment
    prompt: |
      ```javascript
      let a = [1, 2];
      let b = a;
      b.push(3);
      console.log(a);
      ```
      What prints?
    options:
      - text: "`[1, 2, 3]`"
        correct: true
        feedback: Right — `b = a` bound a second name to the same array, so both see the change.
      - text: "`[1, 2]`"
        feedback: >-
          That would be true if assignment copied the value. It binds a name to the
          existing value instead.
      - text: It throws, because arrays cannot be shared
        feedback: Sharing is normal and is how data is passed around without copying.
    explanation: >-
      Assignment binds a name to a value; it does not copy. `a` and `b` are two labels on
      one array, so `push` through either is visible through both. This is the single most
      common source of "my data changed and I do not know why".

  - id: reassign-vs-mutate
    kind: choice
    concept: mutability
    prompt: "Which of these does NOT affect any other name bound to the same value?"
    options:
      - text: "`b = [9, 9]`"
        correct: true
        feedback: Right — this moves the label `b`, leaving the old value and its other names alone.
      - text: "`b.push(9)`"
        feedback: Changes the value itself, so every name bound to it sees the change.
      - text: "`b.sort()`"
        feedback: "`sort` is in place — it changes the array rather than returning a new one."
      - text: "`b.name = 'x'`"
        feedback: Changes the object, visible through every name bound to it.
    explanation: >-
      Reassignment moves a label. Mutation changes the thing a label points at. Classifying
      every line into one of those two categories is the whole skill — `b = [...b, 9]`
      builds a new array and moves the label, so it is safe; `b.push(9)` is not.

  - id: const-meaning
    kind: choice
    concept: mutability
    prompt: "`const list = [1, 2]; list.push(3);` — what happens?"
    options:
      - text: It works. `const` prevents rebinding the name, not changing the value.
        correct: true
        feedback: >-
          Exactly. `list = [9]` would throw; `list.push(3)` is fine. Java's `final` and
          C++'s `const` pointer behave the same way.
      - text: It throws, because `list` is constant
        feedback: >-
          Try it. `const` freezes the binding. For an immutable value use `Object.freeze`.
      - text: It silently does nothing
        feedback: It genuinely mutates the array.
    explanation: >-
      `const` makes the *binding* immutable, not the value. This trips people in every
      language with a similar keyword. If you need the value itself protected, that is a
      separate tool — `Object.freeze` in JavaScript, `.freeze` in Ruby, or a language where
      data is immutable by default.

  - id: mutating-param
    kind: multi
    concept: variables
    prompt: "A function takes an array and should not surprise its caller. Which are safe?"
    options:
      - text: "`return prices.map(p => p * 1.2)`"
        correct: true
        feedback: Builds a new array; the caller's is untouched.
      - text: "`return [...prices].sort()`"
        correct: true
        feedback: Copies first, then sorts the copy.
      - text: "`prices.forEach((p, i) => { prices[i] = p * 1.2 })`"
        feedback: Writes into the caller's array. The original data is gone.
      - text: "`prices.sort(); return prices`"
        feedback: "`sort` is in place, so the caller's array is reordered as a side effect."
    explanation: >-
      A function that returns a value *and* mutates its argument is doing two things, and
      the second one is invisible at the call site. Returning a new value is almost always
      the right choice at a module boundary. Inside a tight private loop, mutating in place
      is a reasonable optimisation — the caller is you.

  - id: explain-aliasing
    kind: recall
    concept: assignment
    prompt: >-
      A teammate reports that a config object "randomly changes" partway through a request.
      Explain what you would suspect and how you would prove it.
    key_points:
      - Something holds a second reference to the same object and is mutating through it
      - Assignment does not copy, so passing the config anywhere shares it
      - Find every place the object is passed, especially functions that return nothing
      - "`Object.freeze` it to convert a silent mutation into a thrown error with a stack trace"
      - A shallow copy only protects the top level — nested objects are still shared
      - Fix by not mutating shared data, or by copying at the boundary
    model: >-
      Nothing is random — something else holds a reference to the same object and is
      mutating it. Assignment binds a name rather than copying, so every function the
      config was passed to has a live reference. I would look for functions that take the
      config and return nothing, since those are the ones mutating rather than deriving.
      To prove it quickly I would `Object.freeze` the config at creation: in strict mode the
      offending write then throws, and the stack trace names the culprit directly instead of
      me reading every call site. The fix is to stop mutating shared state — return a new
      object instead — and if a copy is needed at the boundary, to remember that a shallow
      copy only protects the top level.
