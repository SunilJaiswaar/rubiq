id: dsa-binary-search
language: ruby
title: Write binary search — and survive the edge cases
brief: >-
  Implement `binary_search(sorted, target)`. Return the index of `target`, or `-1` if it is
  not present.


  The hidden tests cover the cases that break most first attempts: the empty array, a
  single element, a target at either end, and a target outside the range entirely. One test
  has a time limit, so an accidental infinite loop will be caught rather than hanging.


  Before you write anything, decide your loop condition and your two range updates, and
  write down why each one is what it is. Then check your code against that reasoning. The
  lesson's point is that this is faster than adjusting signs until the tests pass.


  Ruby note: `Array#bsearch` already does this, and in real code you should use it. Write it
  by hand once anyway — the invariant you practise here is the one you need to read
  `bsearch`'s two modes correctly, and to get a hand-rolled variant (first index ≥ x, last
  index ≤ x) right when `bsearch` does not fit.
starter: |
  def binary_search(sorted, target)
    low = 0
    high = sorted.size - 1

    # Invariant: if `target` is in the array, its index is within low..high.
    #
    # Decide, and justify to yourself, before you write the body:
    #   - Is the loop condition `low < high` or `low <= high`?
    #   - Do the updates use `mid` or `mid ± 1`?
    #   - What does `high` start at for an empty array, and does your
    #     condition handle that without a special case?

    -1
  end

  # Scratch space — click Run.
  data = [1, 3, 5, 7, 9, 11, 13]
  puts "find 7 : #{binary_search(data, 7)}"    # 3
  puts "find 1 : #{binary_search(data, 1)}"    # 0
  puts "find 13: #{binary_search(data, 13)}"   # 6
  puts "find 8 : #{binary_search(data, 8)}"    # -1
  puts "empty  : #{binary_search([], 1)}"      # -1
solution: |
  def binary_search(sorted, target)
    low = 0
    high = sorted.size - 1

    # `<=` because low == high is a range of ONE candidate, not an empty range.
    # For an empty array high starts at -1, so the body never runs and we fall
    # through to -1 — no special case needed.
    while low <= high
      # `(low + high) / 2` is safe in Ruby: Integers are arbitrary precision, so
      # there is no overflow to avoid. The `low + (high - low) / 2` form you see
      # everywhere is a habit from fixed-width languages. Integer division already
      # floors, so there is no `floor` call either.
      mid = (low + high) / 2

      return mid if sorted[mid] == target

      # The ±1 excludes mid, which is what guarantees the range shrinks every
      # iteration — and therefore that the loop terminates.
      if sorted[mid] < target
        low = mid + 1
      else
        high = mid - 1
      end
    end

    -1
  end
hints:
  - >-
    Start from the invariant: "if the target is present, it is at an index between `low`
    and `high` inclusive." Every line should preserve that.
  - >-
    When should the loop keep going? While the range could still contain the target. Is
    `low == high` an empty range, or a range of one?
  - >-
    After comparing against `sorted[mid]`, you know `mid` is not the answer. Your update
    must exclude it — otherwise the range can stay the same size and the loop never ends.
  - >-
    You do not need `low + (high - low) / 2` here, and you do not need to floor anything.
    Ruby Integers never overflow, and `/` on two Integers already floors. If you reached
    for either, ask yourself which language you were defending against.
  - >-
    Test the empty array by hand. `high` starts at `-1`, so the loop body should never
    run. Does your condition handle that, or did you add a special case you did not need?
  - >-
    A wrong `mid` is worth checking directly: `sorted[mid]` on an out-of-range index
    returns `nil`, and comparing `nil` with `<` raises `NoMethodError` rather than
    silently misbehaving. If you see that error, your range arithmetic let `mid` escape
    `low..high`.
tests:
  - id: finds-middle
    name: Finds a value in the middle
    call: binary_search([1, 3, 5, 7, 9, 11, 13], 7)
    expect: 3
  - id: finds-first
    name: Finds the first element
    call: binary_search([1, 3, 5, 7, 9, 11, 13], 1)
    expect: 0
  - id: finds-last
    name: Finds the last element
    call: binary_search([1, 3, 5, 7, 9, 11, 13], 13)
    expect: 6
  - id: absent-inside
    name: Returns -1 for a value that is absent but within range
    call: binary_search([1, 3, 5, 7, 9, 11, 13], 8)
    expect: -1
  - id: absent-below
    name: Returns -1 for a value below everything
    call: binary_search([1, 3, 5], 0)
    expect: -1
  - id: absent-above
    name: Returns -1 for a value above everything
    call: binary_search([1, 3, 5], 99)
    expect: -1
  - id: empty
    name: Handles the empty array
    call: binary_search([], 1)
    expect: -1
  - id: single-hit
    name: Finds the only element in a one-element array
    call: binary_search([42], 42)
    expect: 0
  - id: single-miss
    name: Returns -1 in a one-element array that does not match
    call: binary_search([42], 7)
    expect: -1
  - id: two-elements
    name: Handles both positions in a two-element array
    hidden: true
    call: "[binary_search([1, 2], 1), binary_search([1, 2], 2), binary_search([1, 2], 3)]"
    expect: [0, 1, -1]
  - id: large-terminates
    name: Terminates on a large array (catches a non-shrinking range)
    hidden: true
    call: "binary_search(Array.new(100_000) { |i| i * 2 }, 99_998)"
    expect: 49999
  - id: every-index
    name: Finds every element of an array, at every index
    hidden: true
    call: "[2, 4, 6, 8, 10, 12, 14, 16].then { |a| a.each_with_index.all? { |v, i| binary_search(a, v) == i } }"
    expect: true
  - id: negatives-and-zero
    name: Works across negative values and zero
    hidden: true
    call: "[binary_search([-9, -4, 0, 3, 8], -9), binary_search([-9, -4, 0, 3, 8], 0), binary_search([-9, -4, 0, 3, 8], 8)]"
    expect: [0, 2, 4]
