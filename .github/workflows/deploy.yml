name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Only one deployment at a time, and do not cancel one in progress — a half-finished
# deploy would leave the site broken.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Create the Pages site via the API if it does not exist yet, instead of
          # failing with "Get Pages site failed". Without this, the very first push
          # to a fresh repo (or any fork) fails until someone clicks through
          # Settings → Pages by hand — which is a bad first impression for a project
          # whose whole premise is that deploying costs nothing and needs no setup.
          enablement: true

      - run: npm ci

      - name: Build
        env:
          # A project site is served from /<repo>/, a user or org site from /.
          # configure-pages works this out and hands it to us, so the same workflow
          # deploys correctly either way without being edited.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
