version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    # No `cooldown` here, deliberately — it was tried and removed.
    #
    # A cooldown restricts the registry view Dependabot resolves against. This
    # project's lockfile is deliberately at latest across the board, so eight direct
    # dependencies were newer than a 5-day window and its updater could not resolve
    # the tree at all, failing with "no matching version found ... with a date before
    # <cutoff>" on a version that plainly exists. Widening the window made it worse,
    # not better.
    #
    # The two coherent policies are "stay at latest, no cooldown" and "hold a cooldown
    # and do not install anything newer than it". This project takes the first: get
    # current, then let Dependabot maintain it.
    groups:
      # `vitest` and `@vitest/*` pin each other at an exact version, so a PR that
      # bumps one without the other cannot install — `npm ci` fails with ERESOLVE
      # before any test runs. They must always move together, including on majors,
      # which is why this group has no `update-types` filter.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # One PR for the rest of the dev toolchain rather than eight — these move
      # together and none of them ship to visitors.
      #
      # Deliberately NO `update-types` filter. With one, majors escape the group and
      # arrive as individual PRs — which is exactly how `eslint` and `@eslint/js`
      # ended up in separate PRs that could not install, since ESLint 10 also needs
      # eslint-plugin-react-hooks 7. Grouped, they move together and the PR is
      # buildable.
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
          - "@testing-library/*"
          - "jsdom"
          - "typescript"
      # Vite and its plugin have the same relationship.
      build:
        patterns: ["vite", "@vitejs/*", "tailwindcss", "@tailwindcss/*"]
      # GitHub's own actions move in lockstep and a major bump is usually just a
      # runner Node version change, so one PR is enough.
      github-actions:
        patterns: ["actions/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
